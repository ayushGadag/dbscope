[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbscope"
version = "0.1.0"
description = "Enterprise Database Change Impact Analysis Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ayush Gadag" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
dbscope = "dbscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
